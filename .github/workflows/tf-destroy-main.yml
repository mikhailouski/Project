name: Destroy Main Infrastructure
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "destroy" to proceed'
        required: true

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Validate Confirmation
      if: inputs.confirmation != 'destroy'
      run: exit 1

    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION}}

    - name: Destroy Main Infrastructure
      run: |
        cd main-infrastructure
        terraform init
        terraform destroy -auto-approve